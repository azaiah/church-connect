<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101C2E" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Link preview + SEO tags are generated at build time from site.config.json (see vite.config.ts). Do not hard-code the domain here. -->
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__PAGE_DESC__" />
    <meta name="robots" content="__PAGE_ROBOTS__" />
    <link rel="canonical" href="__PAGE_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChurchConnect by DataIsData" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:title" content="__PAGE_OG_TITLE__" />
    <meta property="og:description" content="__PAGE_OG_DESC__" />
    <meta property="og:image" content="__PAGE_IMAGE__" />
    <meta property="og:image:secure_url" content="__PAGE_IMAGE__" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__PAGE_IMAGE_ALT__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__PAGE_OG_TITLE__" />
    <meta name="twitter:description" content="__PAGE_OG_DESC__" />
    <meta name="twitter:image" content="__PAGE_IMAGE__" />
    <meta name="twitter:image:alt" content="__PAGE_IMAGE_ALT__" />
    <!-- Netlify's hashed deploy addresses (e.g. 6a1f2c--site.netlify.app) always forward to the main address -->
    <script>(function(){var c='__SITE_HOST__',h=location.hostname;if(h!==c&&h.slice(-(c.length+2))==='--'+c&&h.indexOf('deploy-preview-')!==0){location.replace('https://'+c+location.pathname+location.search+location.hash)}})()</script>
  </head>
  <body>
    <!-- Hidden static forms so Netlify Forms detects them at build time -->
    <form name="pilot-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="church" />
      <input type="text" name="role" />
      <input type="text" name="size" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="currentTools" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="church-contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
